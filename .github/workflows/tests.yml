name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Offline tests
        run: python tests/smoke_test.py

      - name: Browser tests against the mock Handshake
        run: python tests/browser_test.py

      - name: End-to-end command line tests
        run: python tests/cli_test.py

      - name: Double-click launcher tests
        run: python tests/launcher_test.py
